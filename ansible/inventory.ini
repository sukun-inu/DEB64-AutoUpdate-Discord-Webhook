# ============================================================
# 時刻の考え方（バックアップは 0〜6 時に動く前提）
#   VM   : 02:30 に更新 → 1 台ずつ 30 分おきに再起動（冗長ペアが同時に落ちないように）
#   PVE  : バックアップ後の 06:30 に更新 → 1 台ずつ 30 分おきに再起動
#   PBS  : 06:30 に更新 → PVE の後に再起動
# 再起動の直前にもバックアップ実行中・クラスタ停止ノードの有無を確認し、
# 危なければ待つ／見送る（apt-maintenance.sh do-reboot）。
# ============================================================

[pve]
pve-01.prod.dc1.kawasaki-n3t.f5.si reboot_time=07:00
pve-02.prod.dc1.kawasaki-n3t.f5.si reboot_time=07:30

[pbs]
pbs-01.prod.dc1.kawasaki-n3t.f5.si reboot_time=08:00

[vm]
dpl-01.prod.dc1.kawasaki-n3t.f5.si reboot_time=03:00
dpl-02.prod.dc1.kawasaki-n3t.f5.si reboot_time=03:30
dns-01.prod.dc1.kawasaki-n3t.f5.si reboot_time=04:00

[pve:vars]
ansible_user=root

[pbs:vars]
ansible_user=root

# VM は root で SSH できない。kawasaki で入って sudo で root になる
[vm:vars]
ansible_user=kawasaki
ansible_become=true
ansible_become_method=sudo

[hosts:children]
pve
pbs
